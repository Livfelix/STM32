; Projeto SG-6CH — Plataforma: VSCode + PlatformIO (framework STM32Cube/HAL)
; Placa alvo: STM32F103C8T6 da placa integrada ADS1256+STM32 (mesmo chip da Blue Pill)
; Gravar: ST-Link em JTAG1 (SWD). Monitor: adaptador USB-TTL em P4 @921600.
[env:sg6]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 921600
board_build.f_cpu = 72000000L
board_build.ldscript = ld/STM32F103C8_config.ld
board_upload.maximum_size = 63488
build_flags =
    -Os
    -Iinclude
    -Wall
    -Wno-unused-variable
    -Wl,-Map,.pio/build/sg6/firmware.map
build_src_filter = +<*>
lib_ldf_mode = off
